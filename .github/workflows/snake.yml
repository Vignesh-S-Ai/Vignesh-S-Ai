name: Generate Futuristic Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate futuristic contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vignesh-S-Ai
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2358A6FF&color_dots=%230D1117,%23161B22,%231F6FEB,%2358A6FF,%2364FFDA
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2364FFDA&color_dots=%230D1117,%23161B22,%231F6FEB,%2358A6FF,%2364FFDA

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
